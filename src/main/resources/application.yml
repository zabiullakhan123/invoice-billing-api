spring:
  application:
    name: billing-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/billing}
    username: ${DB_USERNAME:billing}
    password: ${DB_PASSWORD:billing}

  jpa:
    hibernate:
      # "update" creates/alters tables automatically: convenient for development.
      # For production, switch to Flyway migrations and set this to "validate".
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

jwt:
  # DEVELOPMENT DEFAULT ONLY. Always set JWT_SECRET in any shared or production environment.
  # Generate one with: openssl rand -base64 48
  secret: ${JWT_SECRET:4aw/Ucpa8vXAHzUqSanM2ksBxaNasLDOBurXB6OB+pq5xIZJKowvWbc3UbK2RoDH}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.example.billing: INFO
